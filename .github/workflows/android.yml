name: Build JALAYAJAY TV APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Install dependencies
        run: npm install
      - name: Prepare web assets
        run: npm run build:web
      - name: Add Android platform
        run: npx cap add android
      - name: Apply original JALAYAJAY TV icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          curl -fsSL 'https://raw.githubusercontent.com/sitajono437-cpu/JALAYAJAY-TV/main/Screenshot_2026-11-24-16-45-38-563_com.larus.wolf-edit.jpg' -o android/app/src/main/res/drawable/jalayajay_icon.jpg
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s = s.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/jalayajay_icon"')
          s = s.replace('android:roundIcon="@mipmap/ic_launcher_round"', 'android:roundIcon="@drawable/jalayajay_icon"')
          p.write_text(s)
          PY
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JALAYAJAY-TV-Sample-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
